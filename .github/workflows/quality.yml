name: Jimmy – Quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node tools/sync-knowledge.cjs
          node --test tests/*.test.cjs
          for file in *.js; do node --check "$file"; done
          node tools/build-site.cjs

