name: Jimmy – GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate knowledge and application
        run: |
          node tools/sync-knowledge.cjs
          node --test tests/*.test.cjs
          for file in *.js; do node --check "$file"; done
          node tools/build-site.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = `${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}/artifacts?per_page=100`;
          for (let attempt = 1; attempt <= 12; attempt++) {
            const response = await fetch(endpoint, {
              headers: {
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28'
              },
              signal: AbortSignal.timeout(10000)
            });
            if (!response.ok) throw Error(`Artifact metadata request failed (HTTP ${response.status}).`);
            const data = await response.json();
            const artifacts = data.artifacts.filter(artifact => artifact.name === 'github-pages' && !artifact.expired);
            if (artifacts.length === 1) {
              console.log('Pages artifact metadata is available.');
              process.exit(0);
            }
            if (artifacts.length > 1) throw Error('Multiple Pages artifacts found. Start a fresh workflow run.');
            console.log(`Waiting for Pages artifact metadata (${attempt}/12).`);
            if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 3000));
          }
          throw Error('Pages artifact metadata is still unavailable. Start a fresh workflow run.');
          NODE
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
      - name: Allow artifact service metadata to settle before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 15
      - uses: actions/deploy-pages@v4
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'

